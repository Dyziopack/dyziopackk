<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DyzioPack</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
}

.header{
background:#181818;
padding:20px;
border-bottom:4px solid orange;
text-align:center;
}

.logo{
font-size:50px;
color:orange;
font-weight:bold;
}

.hero{
background:linear-gradient(to bottom,#00bfff,#111);
text-align:center;
padding:70px 20px;
}

.hero h1{
font-size:60px;
}

.button{
background:orange;
color:black;
padding:15px 30px;
border:none;
border-radius:10px;
font-size:25px;
font-weight:bold;
cursor:pointer;
}

#packi{
max-height:0;
overflow:hidden;
transition:max-height .8s ease;
}

#packi.open{
max-height:3000px;
}

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
padding:30px;
}

.card{
width:380px;
background:#222;
border:3px solid orange;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 15px rgba(255,140,0,.4);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
display:block;
}

.info{
padding:20px;
}

.info h2{
color:#00bfff;
}

.download{
display:inline-block;
margin-top:10px;
background:orange;
color:black;
padding:12px 25px;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}
</style>
</head>
<body>

<div class="header">
<div class="logo">DyzioPack</div>
</div>

<div class="hero">

<button class="button" onclick="togglePacki()">
📦 Texturepacki
</button>

<h1>Najlepsze Texturepacki Minecraft</h1>

<p>Kliknij Texturepacki aby pokazać lub schować packi.</p>

</div>

<div id="packi">

<div class="cards">

<div class="card">

<img src="potwór.png.png">

<div class="info">
<h2>🟢 Monster Energy Pack</h2>

<a class="download"
href="https://www.mediafire.com/file/a0x56yixemtg86i/Monster_Energy.zip/file"
target="_blank">
Pobierz
</a>

</div>

</div>

<div class="card">

<img src="crystal.png.webp">

<div class="info">
<h2>💎 Crystal Pack</h2>

<a class="download"
href="https://www.mediafire.com/file/g2y59pnxuhs4v10/Black_Pack.zip/file"
target="_blank">
Pobierz
</a>

</div>

</div>

<div class="card">

<img src="mace.png.webp">

<div class="info">
<h2>⚒️ Mace Pack</h2>

<a class="download"
href="https://www.mediafire.com/file/x4acu372fy280vr/Mace_pvp.zip/file"
target="_blank">
Pobierz
</a>

</div>

</div>

</div>

</div>

<script>
function togglePacki(){
document.getElementById("packi").classList.toggle("open");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DyzioPack</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url("smile-dennis.gif");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.header{
    background:rgba(0,0,0,.8);
    padding:20px;
    text-align:center;
    border-bottom:4px solid orange;
}

.logo{
    font-size:60px;
    color:orange;
    font-weight:bold;
    text-shadow:0 0 20px orange;
}

.hero{
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    font-size:55px;
}

.button{
    background:orange;
    color:black;
    border:none;
    padding:15px 30px;
    border-radius:10px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.ranking,
.stats{
    max-width:600px;
    margin:20px auto;
    padding:20px;
    background:rgba(0,0,0,.75);
    border-radius:15px;
}

#packs{
    max-height:0;
    overflow:hidden;
    transition:max-height 1s ease;
}

#packs.open{
    max-height:7000px;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    padding:30px;
}

.card{
    width:350px;
    background:rgba(20,20,20,.95);
    border:3px solid orange;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 15px orange;
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px) scale(1.03);
    box-shadow:0 0 30px orange;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.info{
    padding:20px;
}

.download{
    display:inline-block;
    margin-top:10px;
    background:orange;
    color:black;
    text-decoration:none;
    padding:12px 25px;
    border-radius:8px;
    font-weight:bold;
}

.downloads{
    color:#00ff88;
    font-size:18px;
    font-weight:bold;
}

h2{
    color:#00bfff;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">DyzioPack</div>
</div>

<div class="hero">

<button onclick="togglePacks()" class="button">
📦 Texturepacki
</button>

<h1>Najlepsze Texturepacki Minecraft</h1>

<div class="ranking">
<h2>🏆 TOP 3</h2>
<p>🥇 Monster Energy Pack - 14 pobrań</p>
<p>🥈 Crystal Pack - 9 pobrań</p>
<p>🥉 Mace Pack - 8 pobrań</p>
</div>

<div class="stats">
<p>📦 Liczba Packów: 6</p>
<p>⬇ Łączne Pobrania: 32</p>
</div>

</div>

<div id="packs">

<div class="cards">

<div class="card">
<img

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DyzioPack</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;

    background:
    linear-gradient(
    rgba(0,0,0,.55),
    rgba(0,0,0,.55)
    ),
    url("smile-dennis.gif");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.header{
    background:rgba(0,0,0,.8);
    padding:20px;
    text-align:center;
    border-bottom:4px solid orange;
}

.logo{
    font-size:60px;
    color:orange;
    font-weight:bold;
    text-shadow:0 0 20px orange;
}

.hero{
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    font-size:55px;
}

.button{
    background:orange;
    color:black;
    border:none;
    padding:15px 30px;
    border-radius:10px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.button:hover{
    transform:scale(1.05);
}

.ranking,
.stats{
    max-width:600px;
    margin:20px auto;
    padding:20px;
    background:rgba(0,0,0,.75);
    border-radius:15px;
}

#packs{
    max-height:0;
    overflow:hidden;
    transition:max-height 1s ease;
}

#packs.open{
    max-height:7000px;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25

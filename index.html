<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DyzioPack</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#0f0f0f;
color:white;
text-align:center;
}

h1{
color:orange;
font-size:60px;
margin-top:40px;
margin-bottom:20px;
text-shadow:0 0 15px orange;
}

.texture-btn{
padding:18px 40px;
font-size:28px;
font-weight:bold;
background:orange;
border:none;
border-radius:15px;
cursor:pointer;
margin-bottom:20px;
}

.texture-btn:hover{
background:#ffbf00;
}

.stats{
margin-bottom:25px;
color:#ccc;
font-size:18px;
}

#packs{
max-height:0;
overflow:hidden;
opacity:0;
transform:translateY(-200px);
transition:
max-height 1.2s ease,
opacity 1s ease,
transform 1s ease;
}

#packs.open{
max-height:5000px;
opacity:1;
transform:translateY(0);
}

.grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
padding:30px;
}

.card{

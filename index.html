<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DyzioPack</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:url("smile-dennis.gif");
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
text-align:center;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
z-index:-1;
}

h1{
color:orange;
font-size:65px;
margin-top:40px;
margin-bottom:20px;
text-shadow:0 0 20px orange;
}

.texture-btn{
padding:18px 40px;
font-size:28px;
font-weight:bold;
background:orange;
border:none;
border-radius:15px;
cursor:pointer;
margin-bottom:20px;
}

.texture-btn:hover{
background:#ffbf00;
}

.

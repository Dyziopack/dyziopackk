<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DyzioPack</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

.header{
    background:#181818;
    padding:20px;
    text-align:center;
    border-bottom:4px solid orange;
}

.logo{
    font-size:50px;
    color:orange;
    font-weight:bold;
}

.hero{
    background:linear-gradient(to bottom,#00bfff,#111);
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:50px;
}

.button{
    background:orange;
    color:black;
    border:none;
    padding:15px 30px;
    border-radius:10px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

#packs{
    display:none;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    padding:30px;
}

.card{
    width:350px;
    background:#222;
    border:3px solid orange;
    border-radius:15px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.info{
    padding:20px;
}

.download{
    display:inline-block;
    margin-top:10px;
    background:orange;
    color:black;
    text-decoration:none;
    padding:12px 25px;
    border-radius:8px;
    font-weight:bold;
}

.downloads{
    color:#00ff88;
    font-size:18px;
    margin:10px 0;
}
</style>
</head>
<body>

<div class="header">
<div class="logo">DyzioPack</div>
</div>

<div class="hero">
<button onclick="togglePacks()" class="button">
📦 Texturepacki  ← klikni 
    by ukazac textury
</button>

<h1>Najlepsze Texturepacki Minecraft</h1>
</div>

<div id="packs">

<div class="cards">

<div class="card">
<img src="crystal.png.webp">
<div class="info">
<h2>💎 Crystal Pack</h2>
<p class="downloads">⬇ Pobrania: 9</p>
<a class="download"
href="https://www.mediafire.com/file/g2y59pnxuhs4v10/Black_Pack.zip/file"
target="_blank">
Pobierz
</a>
</div>
</div>

href="https://www.mediafire.com/file/x4acu372fy280vr/Mace_pvp.zip/file"
target="_blank">
Pobierz

</div>

<div class="card">

target="_blank">
Pobierz
</a>

</div>

<div class="card">

<p class="downloads">⬇ Pobrania: 0</p>
<a class="download"
href="https://www.mediafire.com/file/qg4igsb64iot489/Kjega16_Christmas_Pack.zip/file"
target="_blank">
Pobierz

</div>

<div class="card">

<p class="downloads">⬇ Pobrania: 0</p>

href="https://www.mediafire.com/file/mycqjivfbuaoy26/Dyzio_Pack.zip/file"

</div>

<script>
function togglePacks() {
  let packs = document.getElementById("packs");

  if (packs.style.display === "block") {
    packs.style.display = "none";
  } else {
    packs.style.display = "block";
  }
}
</script>

</body>
</html>

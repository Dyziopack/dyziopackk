<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DyzioPack</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
}

.header{
background:#181818;
padding:20px;
border-bottom:4px solid orange;
text-align:center;
}

.logo{
font-size:50px;
color:orange;
font-weight:bold;
}

.hero{
background:linear-gradient(to bottom,#00bfff,#111);
text-align:center;
padding:70px 20px;
}

.hero h1{
font-size:60px;
}

.button{
background:orange;
color:black;
padding:15px 30px;
border:none;
border-radius:10px;
font-size:25px;
font-weight:bold;
cursor:pointer;
}

#packi{
max-height:0;
overflow:hidden;
transition:max-height .8s ease;
}

#packi.open{
max-height:5000px;
}

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
padding:30px;
}

.card{
width:380px;
background:#222;
border:3px solid orange;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 15px rgba(255,140,0,.4);
}

.card img{
width:100%;

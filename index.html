<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>DyzioPack</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
text-align:center;
}

h1{
color:orange;
margin-top:50px;
}

button{
padding:15px 30px;
font-size:24px;
background:orange;
border:none;
border-radius:10px;
cursor:pointer;
}

#packs{
display:none;
margin-top:30px;
}
</style>
</head>

<body>

<h1>DyzioPack</h1>

<button onclick="togglePacks()">
📦 Texturepacki
</button>

<div id="packs">

<h2>💎 Crystal Pack</h2>

<h2>⚒️ Mace Pack</h2>

<h2>🟢 Monster Energy Pack</h2>

</div>

<script>
function togglePacks(){

var packs=document.getElementById("packs");

if(packs.style.display==="block"){
packs.style.display="none";
}
else{
packs.style.display="block";
}

}
</script>

</body>
</html>
